<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <!-- 카카오톡 / 인스타그램 미리보기 설정 (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="틴플 TEENPLE">
    <meta property="og:description" content="Teen Dream. Teenple.">
    <!-- 미리보기 이미지 URL (필요 시 수정 가능) -->
    <meta property="og:image" content="https://litt.ly/teenple/og-image.png">
    <meta property="og:url" content="https://litt.ly/teenple">

    <!-- 접속 즉시 이동 (HTML Refresh + JavaScript) -->
    <meta http-equiv="refresh" content="0; url=https://litt.ly/teenple">
    <title></title>

    <script>
        // 접속하자마자 바로 리다이렉트 (뒤로가기 시 이 페이지가 남지 않도록 replace 사용)
        window.location.replace("https://litt.ly/teenple");
    </script>
</head>

</html>
